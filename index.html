<!DOCTYPE html>
<html lang="zh-CN" data-palette="magazine-bold">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>文心雕码 — 用写文章的直觉读懂软件工程与 AI 编程</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/styles/main.css" />
  <script>
    (function () {
      try {
        var params = new URLSearchParams(location.search);
        var fromQuery = params.get('palette');
        var allowed = { 'magazine-bold': 1, 'poster-bold': 1 };
        var p = (fromQuery && allowed[fromQuery]) ? fromQuery : localStorage.getItem('wenxin-palette');
        if (p && allowed[p]) document.documentElement.setAttribute('data-palette', p);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app-root">
    <!-- Top Header -->
    <header class="top-bar">
      <div class="top-bar-inner">
        <button type="button" class="brand-identity" id="brand-home-btn">
          <span class="brand-dot" aria-hidden="true"></span>
          <span class="brand-title">文心雕码</span>
          <span class="brand-badge">写作直觉 × AI 编程</span>
        </button>

        <!-- Desktop Segmented Switcher -->
        <nav class="desktop-tabs" aria-label="主导航">
          <button type="button" class="desktop-tab-btn active" data-tab="arch">
            <span class="tab-idx">01</span>全局全景
          </button>
          <button type="button" class="desktop-tab-btn" data-tab="dict">
            <span class="tab-idx">02</span>概念词典
          </button>
          <button type="button" class="desktop-tab-btn" data-tab="stacks">
            <span class="tab-idx">03</span>技术选型
          </button>
          <button type="button" class="desktop-tab-btn" data-tab="cases">
            <span class="tab-idx">04</span>实战案例
          </button>
          <button type="button" class="desktop-tab-btn" data-tab="prompts">
            <span class="tab-idx">05</span>提示词库
          </button>
        </nav>

        <!-- Utility Actions: Palette / Mobile Preview / Theme -->
        <div class="top-actions">
          <details class="palette-switcher" id="palette-switcher">
            <summary
              class="util-btn"
              id="palette-switcher-summary"
              title="切换视觉风格：杂志大胆 / 海报大胆"
            >
              杂志大胆
            </summary>
            <div class="palette-menu" role="listbox" aria-label="视觉风格：杂志大胆 / 海报大胆">
              <button type="button" class="palette-option is-active" data-palette-id="magazine-bold" role="option">
                <span class="palette-swatch" aria-hidden="true"></span>
                <span class="palette-option-name">杂志大胆</span>
                <span class="palette-option-hint">seed #9B1D1F · 编辑杂志</span>
              </button>
              <button type="button" class="palette-option" data-palette-id="poster-bold" role="option">
                <span class="palette-swatch" aria-hidden="true"></span>
                <span class="palette-option-name">海报大胆</span>
                <span class="palette-option-hint">seed #E85D04 · 活动海报</span>
              </button>
            </div>
          </details>
          <button
            type="button"
            id="mobile-sim-toggle"
            class="util-btn"
            title="在电脑上直接预览手机端单手交互手感"
          >
            手机端预览
          </button>
          <button
            type="button"
            id="theme-toggle-btn"
            class="util-btn"
            title="切换浅色纸本与深色夜间模式"
          >
            夜间模式
          </button>
        </div>
      </div>
    </header>

    <!-- Single Active View Mount -->
    <main id="active-view-mount" class="view-container"></main>

    <!-- Mobile Thumb-Zone Bottom Tab Bar -->
    <nav class="bottom-tab-bar" aria-label="底部五模块切换">
      <button type="button" class="bottom-tab-item active" data-tab="arch">
        <span class="b-num">01</span>
        <span class="b-label">全景</span>
        <span class="b-sub">六大分工</span>
      </button>
      <button type="button" class="bottom-tab-item" data-tab="dict">
        <span class="b-num">02</span>
        <span class="b-label">词典</span>
        <span class="b-sub">16个概念</span>
      </button>
      <button type="button" class="bottom-tab-item" data-tab="stacks">
        <span class="b-num">03</span>
        <span class="b-label">选型</span>
        <span class="b-sub">网页与App</span>
      </button>
      <button type="button" class="bottom-tab-item" data-tab="cases">
        <span class="b-num">04</span>
        <span class="b-label">案例</span>
        <span class="b-sub">三大实战</span>
      </button>
      <button type="button" class="bottom-tab-item" data-tab="prompts">
        <span class="b-num">05</span>
        <span class="b-label">模板</span>
        <span class="b-sub">AI提示词</span>
      </button>
    </nav>
  </div>

  <!-- Progressive Disclosure Bottom Sheet / Editorial Drawer -->
  <div id="sheet-backdrop" class="sheet-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div id="sheet-drawer" class="sheet-drawer">
      <div class="sheet-handle-bar">
        <span id="sheet-kicker" style="font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent);"></span>
        <div class="sheet-pill-indicator" aria-hidden="true"></div>
        <button type="button" id="sheet-close-btn" class="sheet-close-btn">关闭 ✕</button>
      </div>
      <div id="sheet-scroll-body" class="sheet-scroll-body"></div>
      <div id="sheet-bottom-nav" class="sheet-bottom-nav"></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
